<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Learning Portal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <img class="login-watermark" src="https://www.beds.ac.uk/media/cvinczqd/uni-of-beds-logo-standard.jpg" alt="" aria-hidden="true">
    <header class="brand-header">
        <div class="brand-mark">UB</div>
        <div class="brand-text">
            <span class="eyebrow">Student Experience</span>
            <h1>University of Bedfordshire</h1>
            <p>Learning Portal</p>
        </div>
    </header>

    <main class="login-panel">
        <div class="panel-head">
            <p class="eyebrow">Welcome back</p>
            <h2>Sign in</h2>
        </div>

        <div class="login-role-switch" role="group" aria-label="Choose account type">
            <button class="login-role active" type="button" data-login-role="student" aria-pressed="true">Student</button>
            <button class="login-role" type="button" data-login-role="admin" aria-pressed="false">Admin</button>
        </div>

        <form id="loginForm">
            <label id="usernameLabel" for="usernameInput">Student username</label>
            <input type="text" id="usernameInput" placeholder="Enter your student username" autocomplete="username" required>

            <label for="passwordInput">Password</label>
            <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password" required>

            <button id="loginBtn" class="primary-btn" type="submit">Student sign in</button>
        </form>

        <p class="error-message" id="loginError" role="alert" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
