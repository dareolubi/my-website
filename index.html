<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Learning Portal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<header class="brand-header">
    <!-- University-style branding: crest, wordmark, circular badge -->
    <img src="crest.png" alt="University Crest" class="logo-crest">
    <div class="brand-text">
        <h1>University of Bedfordshire</h1>
        <p>Student Learning Portal</p>
    </div>
    <img src="badge.png" alt="Student Badge" class="logo-badge">
</header>

<div class="login-container">
    <h2>Sign in to your portal</h2>

    <!-- Virtual Identity: user enters credentials to access personalised dashboard -->
    <input type="text" id="usernameInput" placeholder="Username">
    <input type="password" id="passwordInput" placeholder="Password">

    <!-- Event-driven: click triggers login logic in script.js -->
    <button id="loginBtn">Login</button>

    <p class="error-message" id="loginError"></p>
</div>

<script src="script.js"></script>
</body>
</html>
