<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - Student Learning Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="portal-body">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-mark">UB</div>
                <div class="brand-copy">
                    <span class="eyebrow">Student Portal</span>
                    <h1>Bedfordshire</h1>
                </div>
            </div>

            <nav class="nav-list" aria-label="Main navigation">
                <button class="nav-item" data-page="dashboard.html">Dashboard</button>
                <button class="nav-item" data-page="courses.html">Courses</button>
                <button class="nav-item active" data-page="assignments.html">Assignments</button>
                <button class="nav-item" data-page="library.html">Library</button>
                <button class="nav-item" data-page="timetable.html">Timetable</button>
                <button class="nav-item" data-page="profile.html">Profile</button>
                <button class="nav-item" data-page="support.html">Support</button>
                <button class="nav-item logout" data-page="index.html">Logout</button>
            </nav>

            <div class="sidebar-footer">
                <p>Submission tracker</p>
                <strong>4 active</strong>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Progress overview</p>
                    <h2>Assignments</h2>
                </div>
                <div class="header-actions">
                    <button class="secondary-btn">New submission</button>
                </div>
            </header>

            <section class="stats-grid assignments-summary">
                <article class="stat-card stat-primary">
                    <p>Submitted</p>
                    <h3>2</h3>
                    <span>Well on track</span>
                </article>
                <article class="stat-card stat-secondary">
                    <p>In progress</p>
                    <h3>1</h3>
                    <span>Due this week</span>
                </article>
                <article class="stat-card stat-accent">
                    <p>Not started</p>
                    <h3>1</h3>
                    <span>Needs attention</span>
                </article>
            </section>

            <section id="assignmentList" class="assignment-list"></section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
