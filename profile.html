<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Student Learning Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="portal-body">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-mark">UB</div>
                <div class="brand-copy">
                    <span class="eyebrow">Student Portal</span>
                    <h1>Bedfordshire</h1>
                </div>
            </div>

            <nav class="nav-list" aria-label="Main navigation">
                <button class="nav-item" data-page="dashboard.html">Dashboard</button>
                <button class="nav-item" data-page="courses.html">Courses</button>
                <button class="nav-item" data-page="assignments.html">Assignments</button>
                <button class="nav-item" data-page="timetable.html">Timetable</button>
                <button class="nav-item active" data-page="profile.html">Profile</button>
                <button class="nav-item" data-page="support.html">Support</button>
                <button class="nav-item logout" data-page="index.html">Logout</button>
            </nav>

            <div class="sidebar-footer">
                <p>Student record</p>
                <strong>Verified</strong>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Academic profile</p>
                    <h2>Student profile</h2>
                </div>
                <div class="header-actions">
                    <button class="secondary-btn">Request tutor review</button>
                </div>
            </header>

            <section class="profile-shell">
                <article class="profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar">AR</div>
                        <div>
                            <h3 id="profileName">Aisha Rahman</h3>
                            <p id="profileEmail">aisha.rahman@beds.ac.uk</p>
                        </div>
                    </div>

                    <div id="profileStatus" class="tag success">On track for a First-class degree</div>
                    <div id="profileSummary" class="profile-summary"></div>
                </article>

                <aside class="profile-settings">
                    <div class="panel-header">
                        <h3>Preferences</h3>
                    </div>

                    <div class="field">
                        <label for="profileNameInput">Display name</label>
                        <input id="profileNameInput" type="text" value="Aisha Rahman" placeholder="Your name">
                    </div>

                    <div class="field">
                        <label for="studyGoalInput">Study goal</label>
                        <input id="studyGoalInput" type="text" value="First-class honours" placeholder="Your goal">
                    </div>

                    <button id="saveProfileButton" class="primary-btn" type="button">Save changes</button>
                </aside>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
