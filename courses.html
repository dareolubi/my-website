<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Courses - Student Learning Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body" data-page="courses">

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="badge-circle small-badge">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="#b30000" stroke="#d4af37" stroke-width="4" />
                        <text x="50" y="55" text-anchor="middle" fill="#ffffff" font-size="14">SLP</text>
                    </svg>
                </div>
                <span class="sidebar-title">Portal</span>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item">Dashboard</button>
                <button class="nav-item active">Courses</button>
                <button class="nav-item">Assignments</button>
                <button class="nav-item">Support</button>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutBtn" class="secondary-btn">Logout</button>
            </div>
        </aside>

        <!-- Main content -->
        <div class="main-content">

            <header class="dashboard-header">
                <div class="logo-wrapper">
                    <div class="crest-logo small-crest">
                        <svg viewBox="0 0 100 120">
                            <path d="M10 20 L50 5 L90 20 L90 70 C90 90 70 110 50 115 C30 110 10 90 10 70 Z"
                                  fill="#b30000" stroke="#d4af37" stroke-width="3" />
                        </svg>
                    </div>
                    <div class="wordmark">
                        <span class="wordmark-title">Student Learning Portal</span>
                        <span class="wordmark-subtitle">Courses</span>
                    </div>
                </div>
            </header>

            <main class="dashboard-grid">
                <section class="card">
                    <h2>Your Courses</h2>
                    <p>Here you can view and manage your enrolled modules.</p>
                    <ul>
                        <li>Software Engineering</li>
                        <li>Enterprise Systems</li>
                        <li>Cloud Computing</li>
                        <li>Cybersecurity Fundamentals</li>
                    </ul>
                </section>
            </main>

            <footer class="site-footer">
                <p>&copy; 2026 Student Learning Portal · Designed by Oluwole</p>
            </footer>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
