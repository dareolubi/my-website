<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Student Learning Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="portal-body">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-mark">UB</div>
                <div class="brand-copy">
                    <span class="eyebrow">Student Portal</span>
                    <h1>Bedfordshire</h1>
                </div>
            </div>

            <nav class="nav-list" aria-label="Main navigation">
                <button class="nav-item" data-page="dashboard.html">Dashboard</button>
                <button class="nav-item active" data-page="courses.html">Courses</button>
                <button class="nav-item" data-page="assignments.html">Assignments</button>
                <button class="nav-item" data-page="library.html">Library</button>
                <button class="nav-item" data-page="timetable.html">Timetable</button>
                <button class="nav-item" data-page="profile.html">Profile</button>
                <button class="nav-item" data-page="support.html">Support</button>
                <button class="nav-item logout" data-page="index.html">Logout</button>
            </nav>

            <div class="sidebar-footer">
                <p>Semester</p>
                <strong>Autumn 2026</strong>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Academic record</p>
                    <h2>My courses</h2>
                </div>
                <div class="header-actions">
                    <button class="secondary-btn">Add module</button>
                </div>
            </header>

            <section class="filter-bar">
                <button class="filter-chip active">All</button>
                <button class="filter-chip">Core</button>
                <button class="filter-chip">Elective</button>
                <button class="filter-chip">Project</button>
            </section>

            <section id="courseGrid" class="course-grid"></section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
